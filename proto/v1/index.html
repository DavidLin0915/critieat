<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRITIEAT 美食地圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="blob blob--cyan" aria-hidden="true"></div>
  <div class="blob blob--purple" aria-hidden="true"></div>

  <div class="app">
    <header class="hdr">
      <img class="logo" src="img/logo.png" alt="CRITIEAT" width="158" height="28">
      <button class="hamb" type="button" id="nav-btn" aria-expanded="false" aria-controls="site-nav" aria-label="開啟選單"><span></span><span></span><span></span></button>
      <nav class="nav" id="site-nav">
        <a class="is-active" href="index.html">美食地圖</a>
        <a href="lunch.html">開團單</a>
        <a href="bus.html">公車地圖</a>
      </nav>
      <div class="hdr__right">
        <span id="today-label" class="today mono"></span>
        <button class="pill pill--pick" type="button" id="pick-btn">🎲 不知道吃什麼</button>
        <label class="pill mono"><input type="checkbox" id="hide-closed"> 隱藏沒開的店</label>
      </div>
    </header>
    <p class="notice" id="store-notice" role="status" hidden></p>
    <main class="main">
      <section class="list" id="store-list" aria-label="店家清單"></section>
      <div class="map-wrap"><div class="map" id="map"></div></div>
      <aside class="detail" id="detail" aria-label="店家詳情" hidden></aside>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/mode.js"></script>
  <script src="js/supa.js"></script>
  <script src="js/csv.js"></script>

  <script src="js/data.js"></script>
  <script src="js/store-edit.js"></script>
  <script src="js/store-repo.js"></script>
  <script src="js/member-repo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/places.js"></script>
  <script src="js/store-form.js"></script>
  <script src="js/menu-demo.js"></script>
  <script src="js/menu-data.js"></script>
  <script src="js/menu-draft.js"></script>
  <script src="js/menu-lightbox.js"></script>
  <script src="js/lunch.js"></script>
  <script src="js/lunch-demo.js"></script>

  <script src="js/pick-race-maps.js"></script>
  <script src="js/pick-race.js"></script>
  <script src="js/pick-lightbox.js"></script>
  <script src="js/rating.js"></script>
  <script src="js/rating-demo.js"></script>
  <script src="js/item-rating-demo.js"></script>
  <script src="js/rating-store.js"></script>
  <script src="js/star-picker.js"></script>
  <script src="js/rating-form.js"></script>
  <script src="js/rating-ui.js"></script>
  <script src="js/item-rating-ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
